

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ code }} — FraudLens</title>
<link rel="icon" href="{{ url_for('static', filename='images/logo.png') }}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<div class="d-flex align-items-center justify-content-center" style="min-height:100vh; background:var(--background-color);">
  <div class="fl-card text-center p-5" style="max-width:420px;">
    <div class="fl-brand justify-content-center mb-3">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="FraudLens Logo" class="fl-logo-img">
      <div class="fl-logo-fallback">FL</div>
    </div>
    <h1 style="font-size:2.4rem;">{{ code }}</h1>
    <p class="text-muted-soft mb-4">{{ message }}</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Back to FraudLens</a>
  </div>
</div>
</body>
</html>
